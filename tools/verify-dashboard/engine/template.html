<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<script>document.documentElement.classList.add("js");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:#eef1f6; --surface:#ffffff; --surface-2:#f4f6fa; --raise:#ffffff;
    --ink:#161b24; --dim:#5b6675; --faint:#8b95a6;
    --border:#d9dfe9; --border-2:#c8d0dd;
    --accent:#2563d9; --accent-ink:#ffffff; --accent-soft:#e7efff;
    --pass:#157a43; --pass-soft:#e2f3e9;
    --warn:#b56a00; --warn-soft:#fbeed6;
    --pend:#6a35c9; --pend-soft:#efe7fb;
    --fail:#b5271b; --fail-soft:#fbe4e2;
    --shadow:0 1px 2px rgba(20,27,40,.06), 0 8px 24px rgba(20,27,40,.07);
    --shadow-sm:0 1px 2px rgba(20,27,40,.06);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground:#0e1116; --surface:#161b22; --surface-2:#1c2230; --raise:#1a2029;
      --ink:#e8ecf3; --dim:#9aa4b4; --faint:#6b7686;
      --border:#28303c; --border-2:#333c4a;
      --accent:#5c8dff; --accent-ink:#0b1220; --accent-soft:#182741;
      --pass:#4cc38a; --pass-soft:#12271d;
      --warn:#e0a640; --warn-soft:#2b2312;
      --pend:#b18bf0; --pend-soft:#241a38;
      --fail:#f0736a; --fail-soft:#2e1512;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0e1116; --surface:#161b22; --surface-2:#1c2230; --raise:#1a2029;
    --ink:#e8ecf3; --dim:#9aa4b4; --faint:#6b7686;
    --border:#28303c; --border-2:#333c4a;
    --accent:#5c8dff; --accent-ink:#0b1220; --accent-soft:#182741;
    --pass:#4cc38a; --pass-soft:#12271d;
    --warn:#e0a640; --warn-soft:#2b2312;
    --pend:#b18bf0; --pend-soft:#241a38;
    --fail:#f0736a; --fail-soft:#2e1512;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1120px; margin:0 auto; padding:2.4rem 1.5rem 4rem; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1,h2,h3 { text-wrap:balance; margin:0; }
  .mono { font-family:var(--mono); }
  .tnum { font-variant-numeric:tabular-nums; }

  /* header */
  header.top { display:flex; justify-content:space-between; align-items:flex-start; gap:1.5rem; flex-wrap:wrap; margin-bottom:1.8rem; }
  .eyebrow { font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  h1 { font-size:2.1rem; font-weight:700; letter-spacing:-.02em; margin:.35rem 0 .5rem; }
  .lede { color:var(--dim); font-size:1.02rem; max-width:60ch; }
  .meta { display:flex; flex-direction:column; gap:.35rem; align-items:flex-end; font-family:var(--mono); font-size:.75rem; color:var(--dim); }
  .meta .commit { color:var(--ink); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:.15rem .5rem; }
  .themetoggle { font-family:var(--mono); font-size:.72rem; color:var(--dim); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:.3rem .55rem; cursor:pointer; }
  .themetoggle:hover { border-color:var(--border-2); color:var(--ink); }

  /* CI strip */
  .ci { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 2.6rem; align-items:center; }
  .ci .lbl { font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-right:.3rem; }
  .pill { display:inline-flex; align-items:center; gap:.4rem; font-family:var(--mono); font-size:.8rem; font-weight:500; padding:.32rem .62rem; border-radius:999px; border:1px solid; }
  .pill.pass { color:var(--pass); background:var(--pass-soft); border-color:color-mix(in srgb,var(--pass) 30%,transparent); }
  .pill.note { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
  .pill.fail { color:var(--fail); background:var(--fail-soft); border-color:color-mix(in srgb,var(--fail) 30%,transparent); }
  .dot { width:.5rem; height:.5rem; border-radius:50%; background:currentColor; }

  section { margin-bottom:3rem; }
  .sechead { display:flex; align-items:baseline; gap:.8rem; margin-bottom:1.2rem; padding-bottom:.6rem; border-bottom:1px solid var(--border); }
  .sechead h2 { font-size:1.28rem; font-weight:600; letter-spacing:-.01em; }
  .sechead .k { font-family:var(--mono); font-size:.8rem; color:var(--faint); margin-left:auto; }

  /* summary tiles */
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:.9rem; margin-bottom:1.8rem; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.05rem 1.1rem; box-shadow:var(--shadow-sm); }
  .tile .n { font-family:var(--mono); font-size:2rem; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .tile .n small { font-size:.9rem; color:var(--dim); font-weight:500; }
  .tile .t { color:var(--dim); font-size:.82rem; margin-top:.4rem; }
  .tile.accent .n { color:var(--accent); }
  .tile.pass .n { color:var(--pass); }

  /* test-by-area bars */
  .bars { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.2rem 1.3rem; box-shadow:var(--shadow-sm); }
  .barrow { display:grid; grid-template-columns:11.5rem 1fr 3.2rem; align-items:center; gap:.9rem; padding:.42rem 0; }
  .barrow + .barrow { border-top:1px solid var(--border); }
  .barrow .name { font-size:.9rem; font-weight:500; }
  .barrow .name span { display:block; font-family:var(--mono); font-size:.68rem; color:var(--faint); font-weight:400; }
  .track { height:.62rem; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .track > i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .barrow.eng .track > i { background:var(--accent); }
  .barrow.ui .track > i { background:#3a86c9; }
  .barrow.guard .track > i { background:var(--pend); }
  .barrow .val { font-family:var(--mono); font-size:.92rem; font-weight:600; text-align:right; }
  .barrow .val small { color:var(--faint); font-weight:400; font-size:.7rem; }

  .callouts { display:grid; grid-template-columns:1fr 1fr; gap:.9rem; margin-top:1.2rem; }
  .callout { border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:9px; padding:.8rem .95rem; background:var(--surface); }
  .callout.info { border-left-color:var(--accent); }
  .callout h4 { margin:0 0 .25rem; font-size:.85rem; font-family:var(--mono); font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .callout p { margin:0; font-size:.88rem; color:var(--ink); }

  /* journey cards (Phase 3b — full JourneyCard: video + synced step list) */
  .jlist { display:grid; gap:1.4rem; }
  .jcard { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.1rem 1.25rem 1.25rem; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:.75rem; }
  .jcard.j-failed { border-color:color-mix(in srgb,var(--fail) 45%,var(--border)); box-shadow:0 0 0 1px color-mix(in srgb,var(--fail) 22%,transparent), var(--shadow-sm); }
  .jcard.j-flaky { border-color:color-mix(in srgb,var(--warn) 40%,var(--border)); }
  .jcard.unverified { border-style:dashed; border-color:var(--border-2); background:var(--surface-2); }

  .jhead { display:flex; align-items:flex-start; gap:1rem; justify-content:space-between; flex-wrap:wrap; }
  .jtitle { display:flex; flex-direction:column; gap:.5rem; min-width:0; }
  .jhead h3 { font-size:1.12rem; font-weight:600; letter-spacing:-.01em; }
  .jverdict { display:flex; align-items:center; gap:.7rem; white-space:nowrap; }
  .jdur { font-size:.82rem; color:var(--dim); }
  .jbadge { font-family:var(--mono); font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:.3rem .62rem; border-radius:999px; border:1px solid; white-space:nowrap; }
  .jbadge.pass { color:var(--pass); background:var(--pass-soft); border-color:color-mix(in srgb,var(--pass) 30%,transparent); }
  .jbadge.fail { color:var(--fail); background:var(--fail-soft); border-color:color-mix(in srgb,var(--fail) 30%,transparent); }
  .jbadge.warn { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
  .jbadge.note { color:var(--pend); background:var(--pend-soft); border-color:color-mix(in srgb,var(--pend) 30%,transparent); }
  .jbadge.unver { color:var(--faint); background:transparent; border-color:var(--border-2); border-style:dashed; }

  .jchips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chip { display:inline-flex; align-items:center; gap:.35rem; font-family:var(--mono); font-size:.72rem; font-weight:500; padding:.22rem .5rem; border-radius:999px; border:1px solid; }
  .chip.pass { color:var(--pass); background:var(--pass-soft); border-color:color-mix(in srgb,var(--pass) 30%,transparent); }
  .chip.fail { color:var(--fail); background:var(--fail-soft); border-color:color-mix(in srgb,var(--fail) 30%,transparent); }
  .chip.warn { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
  .chip.note { color:var(--pend); background:var(--pend-soft); border-color:color-mix(in srgb,var(--pend) 30%,transparent); }
  .chip.unver { color:var(--faint); background:transparent; border-color:var(--border-2); }

  .jprov { font-size:.7rem; color:var(--dim); display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; line-height:1.5; padding:.5rem .7rem; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; }
  .jprov .sep { color:var(--faint); }
  .jprov .sha { color:var(--ink); cursor:help; }
  .jprov a { font-weight:500; }

  /* two-column body: walkthrough video left (sticky), steps right. The media column is
     the walkthrough's own width (a 390px phone recording), so the video plays at 1:1
     and its text stays sharp; the height follows the video's own aspect ratio. */
  .jbody { display:grid; grid-template-columns:minmax(0,390px) 1fr; gap:1.3rem; align-items:start; }
  .jvideo { position:sticky; top:1rem; align-self:start; display:flex; flex-direction:column; gap:.4rem; min-width:0; }
  .jvid { width:100%; max-height:85vh; object-fit:contain; display:block; border-radius:10px; border:1px solid var(--border); background:#000; }
  .jreclabel { font-size:.7rem; color:var(--dim); }
  .jnovideo { border:1px dashed var(--border-2); border-radius:10px; background:var(--surface-2); color:var(--faint); font-family:var(--mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; aspect-ratio:4/5; text-align:center; padding:1rem; }
  .jnovideo.unver { color:var(--faint); }

  .jrail { position:relative; height:1.15rem; margin:.1rem .1rem 0; }
  .jrail::before { content:""; position:absolute; left:0; right:0; top:50%; height:2px; transform:translateY(-50%); background:var(--border-2); border-radius:2px; }
  .jmark { position:absolute; top:50%; width:.7rem; height:.7rem; margin-left:-.35rem; transform:translateY(-50%); border-radius:50%; border:2px solid var(--surface); background:var(--accent); cursor:pointer; padding:0; }
  .jmark:hover { transform:translateY(-50%) scale(1.25); }
  .jmark.fail { background:var(--fail); }
  .jmark.current { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .jmark.fail.current { box-shadow:0 0 0 3px var(--fail-soft); }

  /* step screens (Phase 3c): Video | Screens views over one media column, driven by the
     step list. No JS: the tab row and viewer stay hidden and each step links its still
     ("Screen ↗"); with JS (html.js) the links give way to the viewer. */
  .jmedia { position:sticky; top:1rem; align-self:start; display:flex; flex-direction:column; gap:.5rem; min-width:0; }
  .jmedia .jvideo { position:static; }
  .jmodes { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .jmodes[hidden] { display:none; }
  .jmodes [role="tab"] { display:inline-flex; align-items:center; gap:.4rem; min-height:2.25rem; font-family:var(--mono); font-size:.76rem; font-weight:500; color:var(--dim); background:var(--surface); border:1px solid var(--border-2); border-radius:999px; padding:.3rem .8rem; cursor:pointer; }
  .jmodes [role="tab"]:hover { color:var(--ink); }
  .jmodes [role="tab"][aria-selected="true"] { color:var(--accent); background:var(--accent-soft); border-color:var(--accent); font-weight:600; }
  .jcount { font-size:.7rem; }
  .jfailmark { width:.5rem; height:.5rem; border-radius:50%; background:var(--fail); }
  .jsolo { font-size:.76rem; font-weight:600; color:var(--ink); }
  .jsrc { margin-left:auto; font-size:.7rem; color:var(--dim); }
  .jmnote, .jnoshots { margin:0; font-size:.72rem; color:var(--dim); overflow-wrap:anywhere; }
  .jscreens { display:flex; flex-direction:column; gap:.45rem; min-width:0; }
  .jscreens[hidden], .jvideo[hidden] { display:none; }
  .jsnote { margin:0; font-size:.72rem; overflow-wrap:anywhere; }
  .jsnote.warn { color:var(--warn); }
  /* A still is shown at the column's width and never squashed: a tall screen scrolls
     inside the stage, whose height is fixed so stepping does not move the layout. */
  .jstage { height:min(calc(100vh - 12rem), 844px); min-height:18rem; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--border-2); border-radius:10px; background:var(--surface-2); }
  .jstage.fail { border:2px solid var(--fail); }
  .jstage img { display:block; width:100%; height:auto; }
  .jnoshot { height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; font-family:var(--mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); border:1px dashed var(--border-2); border-radius:9px; }
  .jstage.fail .jnoshot { color:var(--fail); border:0; }
  .jstepper { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:.5rem; }
  .jstepper button { min-height:2.25rem; min-width:4.5rem; font-family:var(--mono); font-size:.76rem; color:var(--ink); background:var(--surface); border:1px solid var(--border-2); border-radius:8px; padding:.3rem .6rem; cursor:pointer; }
  .jstepper button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .jstepper button:disabled { color:var(--dim); background:var(--surface-2); border-style:dashed; cursor:default; }
  .jlive { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .jpos { text-align:center; font-size:.74rem; color:var(--dim); overflow-wrap:anywhere; }
  .jpips { display:flex; flex-wrap:wrap; gap:.3rem; justify-content:center; }
  .jpips i { width:.5rem; height:.5rem; border-radius:50%; background:var(--pass); }
  .jpips i.fail { background:var(--fail); }
  .jpips i.none { background:transparent; box-shadow:inset 0 0 0 1px var(--dim); }
  .jpips i.fail.none { box-shadow:inset 0 0 0 1px var(--fail); }
  .jpips i.cur { outline:2px solid var(--accent); outline-offset:1px; }
  .jcap { display:flex; flex-direction:column; gap:.3rem; font-size:.84rem; min-width:0; }
  .jcap-hd { font-weight:500; overflow-wrap:anywhere; }
  .jcap-hd .st { font-family:var(--mono); font-size:.72rem; color:var(--dim); font-weight:400; }
  .jcap-hd.fail .st { color:var(--fail); }
  .jcap .jasserts { padding:0; }
  .jcap .jasserts li { flex-wrap:wrap; overflow-wrap:anywhere; }
  .jcap .jasserts li.pass { display:none; }       /* beside the list at wide widths */
  .jcap-meta { font-size:.7rem; color:var(--dim); overflow-wrap:anywhere; }
  .jcap-meta .trunc { color:var(--warn); }

  .jshot { margin:0 .65rem .55rem 1.9rem; font-size:.72rem; color:var(--dim); overflow-wrap:anywhere; }
  .jshot a { display:inline-flex; align-items:center; min-height:2rem; font-weight:500; }
  .jstep.fail .jshot a { color:var(--fail); font-weight:600; }
  .jnoshot-inline { margin:0 .65rem .55rem 1.9rem; font-size:.72rem; color:var(--dim); }
  .jstep.fail .jnoshot-inline { color:var(--fail); }
  .jfailbtn { margin:0 .65rem .6rem 1.9rem; min-height:2.25rem; font-family:var(--mono); font-size:.74rem; font-weight:600; color:var(--fail); background:var(--surface); border:1px solid var(--fail); border-radius:8px; padding:.3rem .7rem; cursor:pointer; }
  .jfailbtn[hidden] { display:none; }
  .js .jshot, .js .jnoshot-inline { display:none; }
  .js .nojs .jshot, .js .nojs .jnoshot-inline { display:block; }
  .js .nojs .jmodes, .js .nojs .jscreens, .js .nojs .jfailbtn { display:none; }

  .jsteps-wrap { min-width:0; }
  .jsteps { list-style:none; margin:0; padding:0; counter-reset:jstep; display:flex; flex-direction:column; gap:.5rem; }
  .jstep { border:1px solid var(--border); border-radius:9px; background:var(--surface); overflow:hidden; }
  .jstep.fail { border-color:color-mix(in srgb,var(--fail) 55%,var(--border)); background:var(--fail-soft); }
  .jstep.current { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .jstep-hd { display:flex; align-items:flex-start; gap:.55rem; width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit; padding:.55rem .65rem; }
  button.jstep-hd { cursor:pointer; }
  button.jstep-hd:hover { background:var(--surface-2); }
  .sdot { flex:0 0 auto; width:.62rem; height:.62rem; margin-top:.28rem; border-radius:50%; background:var(--pass); }
  .jstep.fail .sdot { background:var(--fail); }
  .slabel { font-size:.9rem; font-weight:500; line-height:1.4; }
  .sscreen { display:inline-block; margin-left:.5rem; font-family:var(--mono); font-size:.68rem; color:var(--faint); font-weight:400; }
  .jasserts { list-style:none; margin:0; padding:0 .65rem .55rem 1.9rem; display:flex; flex-direction:column; gap:.25rem; }
  .jasserts li { font-size:.82rem; color:var(--dim); display:flex; gap:.4rem; align-items:baseline; line-height:1.4; }
  .jasserts .mk { flex:0 0 auto; font-family:var(--mono); font-weight:700; }
  .jasserts li.pass .mk { color:var(--pass); }
  .jasserts li.fail { color:var(--fail); }
  .jasserts li.fail .mk { color:var(--fail); }
  .jasserts s { color:var(--fail); text-decoration-thickness:1px; }
  .jasserts .actual { color:var(--ink); }
  .jsteps-empty { color:var(--dim); font-size:.86rem; margin:.2rem 0 0; }
  .jsteps-empty.unver { color:var(--faint); font-family:var(--mono); font-size:.76rem; }
  .jempty { color:var(--dim); font-size:.9rem; }

  footer { margin-top:1rem; padding-top:1.6rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:1.4rem 2rem; align-items:center; }
  .flink { display:flex; flex-direction:column; gap:.15rem; }
  .flink .lbl { font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .foot-note { margin-left:auto; font-family:var(--mono); font-size:.72rem; color:var(--faint); text-align:right; max-width:34ch; }

  @media (max-width:820px) {
    .tiles { grid-template-columns:repeat(2,1fr); }
    .callouts { grid-template-columns:1fr; }
    /* journey card stacks: video on top full-width (markers kept), steps below;
       the provenance bar stays visible above both. */
    .jbody { grid-template-columns:1fr; gap:1rem; }
    .jvideo, .jmedia { position:static; }
    .jstage { height:min(70vh, 844px); }
    .jcap .jasserts li.pass { display:flex; }       /* the list is below: show them all here */
    .jmodes [role="tab"], .jstepper button, .jfailbtn { min-height:44px; }
    .jshot a { min-height:44px; }
    .barrow { grid-template-columns:8.5rem 1fr 2.8rem; }
    .meta { align-items:flex-start; }
    header.top { flex-direction:column; }
  }
  @media (prefers-reduced-motion:no-preference) {
    .track > i { transition:width .6s cubic-bezier(.2,.7,.2,1); }
  }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{HEADING}}</h1>
      <p class="lede">{{LEDE}}</p>
    </div>
    <div class="meta">
      <button class="themetoggle" id="tt" type="button">◐ theme</button>
      <span>main · <span class="commit">{{COMMIT}}</span></span>
      <span>auto-generated · {{GENERATED_DATE}}</span>
    </div>
  </header>

  <div class="ci">
    <span class="lbl">CI on main</span>
    {{CI_PILLS}}
  </div>

  {{SECTIONS}}

  <footer>
    {{FOOTER_LINKS}}
    <p class="foot-note">{{FOOTER_NOTE}}</p>
  </footer>
</div>

<script>
  (function () {
    var b = document.getElementById("tt");
    b.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : cur === "light" ? "dark"
        : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", next);
    });
  })();

  // Journey cards: video <-> step sync, and the step-screens viewer. Generic: reads only
  // the data-* attributes the engine emits (data-video, data-seek, data-step,
  // data-fail-seek, data-media, data-view, data-fail-step, data-shot-*). With no JS the
  // card is a static, readable list with a "Screen ↗" link per step; nothing
  // below is required to understand a journey.
  (function () {
    function num(v) { var n = v === null || v === "" ? NaN : Number(v); return isNaN(n) ? null : n; }

    // The Screens view: one still at a time, driven by the step list, Prev/Next and the
    // arrow keys. A still's src is only set when that step is shown (then its
    // neighbours are warmed), so nothing is fetched until a reader asks for a screen.
    function screensViewer(card, steps, video) {
      var media = card.querySelector("[data-media]");
      var pane = media && media.querySelector(".jscreens");
      if (!pane) return null;
      var head = media.querySelector(".jmodes");
      var tabs = [].slice.call(media.querySelectorAll('[role="tab"]'));
      var videoPane = media.querySelector(".jvideo");
      var stage = pane.querySelector(".jstage");
      var pos = pane.querySelector(".jpos");
      var live = pane.querySelector(".jlive");
      var prev = pane.querySelector(".jprev");
      var next = pane.querySelector(".jnext");
      var cap = pane.querySelector(".jcap");
      var stepper = pane.querySelector(".jstepper");
      var pips = [].slice.call(pane.querySelectorAll(".jpips i"));
      var total = steps.length;
      var data = steps.map(function (li) {
        var hd = li.querySelector(".jstep-hd");
        return {
          li: li,
          hd: hd,
          src: li.getAttribute("data-shot-src"),
          alt: li.getAttribute("data-shot-alt"),
          w: li.getAttribute("data-shot-w"),
          h: li.getAttribute("data-shot-h"),
          trunc: li.hasAttribute("data-shot-trunc"),
          label: (li.querySelector(".slabel") || li).textContent,
          failed: li.classList.contains("fail"),
          ms: hd ? num(hd.getAttribute("data-seek")) : null,
        };
      });
      var img = document.createElement("img");
      img.decoding = "async";
      // A card that opens on a still (failed, or no walkthrough) loads it only as it
      // nears the screen.
      img.loading = "lazy";
      var cur = -1;
      var mode = "video";
      var warmed = {};

      function warm(i) {
        var d = data[i];
        if (!d || !d.src || warmed[d.src]) return;
        warmed[d.src] = true;
        new Image().src = d.src;
      }

      function caption(d) {
        cap.textContent = "";
        var hd = document.createElement("div");
        hd.className = "jcap-hd" + (d.failed ? " fail" : "");
        hd.appendChild(document.createTextNode(d.label));
        var st = document.createElement("span");
        st.className = "st";
        st.textContent = d.failed ? (d.src ? " — failure screen" : " — failed, no screen captured") : "";
        hd.appendChild(st);
        cap.appendChild(hd);
        var asserts = d.li.querySelector(".jasserts");
        if (asserts) cap.appendChild(asserts.cloneNode(true));
        if (!d.src) return;
        var meta = document.createElement("div");
        meta.className = "jcap-meta mono";
        var a = document.createElement("a");
        a.href = d.src;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "open full size ↗";
        meta.appendChild(a);
        if (d.w && d.h) meta.appendChild(document.createTextNode(" · " + d.w + "×" + d.h));
        if (d.trunc) {
          var t = document.createElement("span");
          t.className = "trunc";
          t.textContent = " · truncated at capture limit — the screen continues below";
          meta.appendChild(t);
        }
        cap.appendChild(meta);
      }

      // `byUser` is false only for the view a card opens on: that still is not announced
      // and its neighbours are not warmed until the reader moves.
      function show(i, byUser) {
        if (i < 0 || i >= total) return;
        cur = i;
        var d = data[i];
        stage.textContent = "";
        stage.scrollTop = 0;
        stage.classList.toggle("fail", d.failed);
        if (d.src) {
          if (d.w && d.h) { img.width = Number(d.w); img.height = Number(d.h); }
          else { img.removeAttribute("width"); img.removeAttribute("height"); }
          img.alt = d.alt;
          img.src = d.src;
          stage.appendChild(img);
          if (byUser) { warm(i - 1); warm(i + 1); }
        } else {
          var none = document.createElement("div");
          none.className = "jnoshot";
          none.textContent = "No screen captured for this step";
          stage.appendChild(none);
        }
        pos.textContent = "Step " + (i + 1) + " of " + total + (d.failed ? " · failed" : "");
        // Screen readers get position, status and label (or the missing screen) in one.
        if (byUser) live.textContent = "Step " + (i + 1) + " of " + total + (d.failed ? ", failed" : "") +
          ": " + (d.src ? d.label : "no screen captured");
        prev.disabled = i === 0;
        next.disabled = i === total - 1;
        // A button disabled under the focus drops it; hand it to the other one.
        if (prev.disabled && document.activeElement === prev) next.focus();
        if (next.disabled && document.activeElement === next) prev.focus();
        data.forEach(function (s, j) {
          s.li.classList.toggle("current", j === i);
          if (j === i) s.li.setAttribute("aria-current", "step"); else s.li.removeAttribute("aria-current");
        });
        pips.forEach(function (p, j) { p.classList.toggle("cur", j === i); });
        caption(d);
      }

      // The step a switch to Screens opens on: the one playback highlights, else the
      // failing step, else the first.
      function startStep() {
        for (var i = 0; i < total; i++) if (data[i].li.classList.contains("current")) return i;
        var f = num(card.getAttribute("data-fail-step"));
        return f !== null && f < total ? f : 0;
      }

      function setMode(m, byUser, at) {
        if (m === "video" && !videoPane) m = "screens";
        mode = m;
        tabs.forEach(function (t) {
          var sel = t.getAttribute("data-mode") === m;
          t.setAttribute("aria-selected", sel ? "true" : "false");
          t.tabIndex = sel ? 0 : -1;
        });
        if (videoPane) videoPane.hidden = m !== "video";
        pane.hidden = m !== "screens";
        if (m === "screens") {
          if (video) video.pause();
          show(at === undefined ? startStep() : at, byUser);
        } else {
          data.forEach(function (s) { s.li.removeAttribute("aria-current"); });
          if (video && cur >= 0 && data[cur].ms !== null) {
            video.currentTime = data[cur].ms / 1000;   // paused on the step; no autoplay
          } else {
            // No seek, so no timeupdate to re-highlight: drop the viewer's highlight.
            data.forEach(function (s) { s.li.classList.remove("current"); });
          }
        }
      }

      head.hidden = false;
      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { setMode(t.getAttribute("data-mode"), true); });
        t.addEventListener("keydown", function (e) {
          var n = tabs.length;
          var j = e.key === "ArrowRight" ? (i + 1) % n : e.key === "ArrowLeft" ? (i - 1 + n) % n
            : e.key === "Home" ? 0 : e.key === "End" ? n - 1 : -1;
          if (j < 0) return;
          e.preventDefault();
          tabs[j].focus();
          setMode(tabs[j].getAttribute("data-mode"), true);
        });
      });
      prev.addEventListener("click", function () { show(cur - 1, true); });
      next.addEventListener("click", function () { show(cur + 1, true); });
      // Arrow keys step only while focus is in the viewer — never page-wide.
      function onKey(e) {
        var j = e.key === "ArrowLeft" ? cur - 1 : e.key === "ArrowRight" ? cur + 1
          : e.key === "Home" ? 0 : e.key === "End" ? total - 1 : null;
        if (j === null) return;
        e.preventDefault();
        show(Math.max(0, Math.min(total - 1, j)), true);
      }
      stage.addEventListener("keydown", onKey);
      stepper.addEventListener("keydown", onKey);
      data.forEach(function (d, i) {
        if (d.hd && d.hd.tagName === "BUTTON") {
          d.hd.addEventListener("click", function () { if (mode === "screens") show(i, true); });
        }
        var fb = d.li.querySelector(".jfailbtn");
        if (fb) {
          fb.hidden = false;
          fb.addEventListener("click", function () { setMode("screens", true, i); stage.focus(); });
        }
      });
      setMode(media.getAttribute("data-view") === "screens" ? "screens" : "video");
      return { active: function () { return mode === "screens"; } };
    }

    document.querySelectorAll(".jcard").forEach(function (card) {
      var video = card.querySelector("[data-video]");
      var steps = [].slice.call(card.querySelectorAll(".jstep[data-step]"));
      var viewer = null;
      try {
        viewer = screensViewer(card, steps, video);
      } catch (err) {
        // A broken viewer must not hide the stills: this card falls back to its links.
        card.classList.add("nojs");
        if (window.console) console.error(err);
      }
      if (!video) return;
      var screensOn = function () { return !!viewer && viewer.active(); };
      var marks = [].slice.call(card.querySelectorAll(".jmark"));

      // Click any element carrying data-seek (step header or marker) -> seek + play.
      // In the Screens view a step click selects its still instead (see the viewer).
      [].slice.call(card.querySelectorAll("[data-seek]")).forEach(function (el) {
        el.addEventListener("click", function () {
          if (screensOn()) return;
          var ms = num(el.getAttribute("data-seek"));
          if (ms === null) return;
          video.currentTime = ms / 1000;
          var p = video.play();
          if (p && p.catch) p.catch(function () {});
        });
      });

      // The server places markers against the run's recorded test duration; the video
      // file itself runs a little longer (it ends when the page closes). Once the real
      // length is known, re-place each marker against it so marker and seek agree.
      var placeMarks = function () {
        var total = video.duration * 1000;
        if (!isFinite(total) || total <= 0) return;
        marks.forEach(function (m) {
          var ms = num(m.getAttribute("data-seek"));
          if (ms === null) return;
          m.style.left = Math.max(0, Math.min(100, (ms / total) * 100)).toFixed(2) + "%";
        });
      };
      if (video.readyState >= 1) placeMarks();
      else video.addEventListener("loadedmetadata", placeMarks, { once: true });

      // Step offsets, ascending, for highlighting the current step as the video plays.
      var timed = steps
        .map(function (s) {
          var hd = s.querySelector("[data-seek]");
          return { el: s, ms: hd ? num(hd.getAttribute("data-seek")) : null };
        })
        .filter(function (s) { return s.ms !== null; })
        .sort(function (a, b) { return a.ms - b.ms; });

      video.addEventListener("timeupdate", function () {
        if (screensOn()) return;   // the viewer owns the highlight while it is shown
        var t = video.currentTime * 1000;
        var cur = null;
        for (var i = 0; i < timed.length; i++) {
          if (timed[i].ms <= t + 1) cur = timed[i]; else break;
        }
        steps.forEach(function (s) { s.classList.toggle("current", !!cur && s === cur.el); });
        marks.forEach(function (m) {
          m.classList.toggle("current", !!cur && num(m.getAttribute("data-seek")) === cur.ms);
        });
      });

      // A failed card opens paused on its failing step, so the failure is what you
      // see. Only cards that carry the attribute (a failing step with a known offset)
      // seek — an absent attribute must not run the seek path at all.
      if (card.hasAttribute("data-fail-seek")) {
        var fseek = num(card.getAttribute("data-fail-seek"));
        if (fseek !== null) {
          var seekFail = function () {
            video.currentTime = fseek / 1000;
          };
          if (video.readyState >= 1) seekFail();
          else video.addEventListener("loadedmetadata", seekFail, { once: true });
        }
      }
    });
  })();
</script>
</body>
</html>
