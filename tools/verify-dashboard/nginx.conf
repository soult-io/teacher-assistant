# teacher-assistant-verify — static server for the TRACK Verification dashboard.
# Unprivileged nginx listens on 8080 (non-root). Public exposure + TLS + Neil's
# access gate are the Lexington NPM's job; this server is reached by the proxy over
# the shared docker network. Serves a single index.html + images/ — synthetic only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard regenerates on every push to main and is served from a fresh,
    # digest-pinned image per deploy, so the document must never be cached stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Screenshots change with the page; a short cache is fine, but never immutable
    # (a new deploy reuses the same /images/*.png filenames).
    location /images/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Single static page (not a client-routed SPA): an unknown path is genuinely
    # not found, so 404 it rather than serving the dashboard with a 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
