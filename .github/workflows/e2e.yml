name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only check out the repo and upload artifacts (artifact
# upload authenticates with the runner's own token, not GITHUB_TOKEN).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs supersede each other. Main runs are NOT cancelled mid-flight: each one is
  # a commit's evidence (the gating result + its walkthrough recording), and a run
  # cancelled after its gate passed would never become dashboard evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # fail fast on hangs — never sit on the 6h default
    # Official Playwright image matching the lockfile version (@playwright/test
    # 1.63.0): chromium, firefox + their system libraries are baked in, removing
    # the flaky per-run apt/CDN browser fetches. Keep this tag in lockstep with
    # @playwright/test — a skew silently reintroduces the runtime browser download.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (PWA + workspace deps)
        run: pnpm -r run build

      - name: Verify Playwright browsers
        run: pnpm --filter @teacher-assistant/e2e exec playwright install chromium firefox

      - name: E2E (Playwright)
        # Actions runs this container as root but sets $HOME=/github/home (owned
        # by the image's pwuser). Firefox refuses to launch as root when $HOME
        # isn't owned by the current user; point it at root's own home. Chromium
        # tolerates the mismatch, which is why this only bites once Firefox is added.
        env:
          HOME: /root
        run: pnpm --filter @teacher-assistant/e2e e2e

      # Always upload, pass or fail: on green these artifacts ARE the journey
      # evidence (videos, traces, results.json) the verification dashboard renders.
      - name: Upload Playwright test-results (videos, traces, results.json)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # Human-pace walkthrough recording (TEACH-16). NON-GATING: it re-runs J1–J6 on
  # chromium with slowMo, per-character typing and a hold after every step, purely to
  # record videos a person can watch. The verification dashboard plays these instead of
  # the gating run's ~2s machine-pace videos, and only when they are of the same commit.
  # - Runs after the gating job passes, on pushes to main (and on manual dispatch) —
  #   never on pull requests, so it cannot slow or block a merge.
  # - continue-on-error keeps this workflow's conclusion the GATING result: a failed
  #   walkthrough still shows as a failed job in this run, and the dashboard then shows
  #   "the walkthrough recording failed" on the card instead of a video.
  walkthrough:
    needs: e2e
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (PWA + workspace deps)
        run: pnpm -r run build

      - name: Verify Playwright browsers
        run: pnpm --filter @teacher-assistant/e2e exec playwright install chromium

      - name: Walkthrough recording (Playwright, human pace)
        env:
          HOME: /root
          E2E_WALKTHROUGH: "1"
        run: pnpm --filter @teacher-assistant/e2e e2e

      # Always upload: a partial recording set is still reported per journey (a failed
      # walkthrough is shown as failed on its card, never as a video).
      - name: Upload walkthrough recordings (videos + walkthrough-evidence.json)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-walkthrough
          path: e2e/test-results-walkthrough/
          retention-days: 14
