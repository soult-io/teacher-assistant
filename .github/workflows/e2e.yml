name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # fail fast on hangs — never sit on the 6h default
    # Official Playwright image matching the lockfile version (@playwright/test
    # 1.63.0): chromium, firefox + their system libraries are baked in, removing
    # the flaky per-run apt/CDN browser fetches. Keep this tag in lockstep with
    # @playwright/test — a skew silently reintroduces the runtime browser download.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (PWA + workspace deps)
        run: pnpm -r run build

      - name: Verify Playwright browsers
        run: pnpm --filter @teacher-assistant/e2e exec playwright install chromium firefox

      - name: E2E (Playwright)
        # Actions runs this container as root but sets $HOME=/github/home (owned
        # by the image's pwuser). Firefox refuses to launch as root when $HOME
        # isn't owned by the current user; point it at root's own home. Chromium
        # tolerates the mismatch, which is why this only bites once Firefox is added.
        env:
          HOME: /root
        run: pnpm --filter @teacher-assistant/e2e e2e

      # Always upload, pass or fail: on green these artifacts ARE the journey
      # evidence (videos, traces, results.json) the verification dashboard renders.
      - name: Upload Playwright test-results (videos, traces, results.json)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
