name: verification-dashboard

# Regenerates the live TRACK Verification dashboard from main and publishes it as a
# small static nginx image to GHCR (ghcr.io/<owner>/teacher-assistant-verify). On a PR
# it builds the page and validates the image build (no push); on push to main it pushes
# sha-<commit> + latest. The deploy stack (nsoult-agentic/stack-lexington-teacher-assistant)
# pins the image by tag + digest and serves it PRIVATELY on Lexington behind the NPM
# (Neil's access gate) — replacing the previous public GitHub Pages target. PII-free/
# synthetic, same as the app images.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_run_id:
        description: >-
          Build from this e2e run's evidence instead of the latest successful main run
          (e.g. to render a PR's stills before merge). It must be a successful e2e.yml
          run. Never published: the image is only pushed on a push to main.
        required: false
        default: ""

# The event name is in the group so a manual (dispatch) run on main can never cancel
# the push run that publishes the image for a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/teacher-assistant-verify

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the generator reads other workflows' run status via the Actions API
    # Node 22 base matching e2e.yml. The generator ingests the e2e run's videos/traces
    # and renders — it drives no browser itself, so no Playwright browsers are needed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: vitest cross-package imports and the PWA `vite preview`
      # both resolve to dist.
      - name: Build all workspaces
        run: pnpm -r run build

      # Resolve the newest SUCCESSFUL e2e run on main (or the dispatch-supplied run);
      # its artifacts are the journey evidence. Bounding to one run keeps artifact
      # handling to a single set.
      - name: Resolve e2e run
        id: e2e
        uses: actions/github-script@v7
        env:
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
        with:
          script: |
            const pinned = (process.env.E2E_RUN_ID || "").trim();
            let run;
            if (pinned) {
              if (!/^\d+$/.test(pinned)) {
                core.setFailed(`e2e_run_id must be a numeric run id, got ${JSON.stringify(pinned)}`);
                return;
              }
              ({ data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(pinned),
              }));
              // Loud, never a silent fallback to main: the operator asked for THIS run.
              if (!run.path.endsWith(".github/workflows/e2e.yml") || run.conclusion !== "success") {
                core.setFailed(
                  `run ${pinned} is ${run.path} (${run.conclusion}) — need a successful e2e.yml run`,
                );
                return;
              }
              // Same-repo runs only: a fork PR's artifacts are attacker-controlled bytes.
              if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed(`run ${pinned} is from ${run.head_repository?.full_name} — same-repo runs only`);
                return;
              }
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "e2e.yml",
                branch: "main",
                // push only: a fork PR from a branch named "main" also has
                // head_branch "main" — its artifacts must never become the evidence.
                event: "push",
                status: "success",
                per_page: 1,
              });
              run = runs.data.workflow_runs[0];
              if (!run) {
                core.warning("no successful main e2e run yet — journeys will render UNVERIFIED");
                return;
              }
            }
            core.setOutput("run_id", String(run.id));
            core.setOutput("head_sha", run.head_sha);
            core.setOutput("run_url", run.html_url);
            core.setOutput("created_at", run.created_at);

      # Download that run's results.json + per-test videos/traces/step stills +
      # journey-evidence.json.
      # continue-on-error: a pre-reporter run has no evidence file; the generator then
      # renders every journey UNVERIFIED rather than failing (loud, never a silent pass).
      - name: Download e2e artifacts
        if: steps.e2e.outputs.run_id
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-test-results
          path: e2e-artifacts
          run-id: ${{ steps.e2e.outputs.run_id }}
          github-token: ${{ github.token }}

      # The human-pace walkthrough recordings (TEACH-16) come from the walkthrough job of
      # the SAME e2e run — same run, same commit as the gating evidence above. The job
      # is non-gating, so it may have failed or not run: then its artifact is absent and
      # every card shows "no walkthrough recorded for this commit" (never the fast video).
      - name: Resolve walkthrough job
        id: walkthrough
        if: steps.e2e.outputs.run_id
        uses: actions/github-script@v7
        env:
          E2E_RUN_ID: ${{ steps.e2e.outputs.run_id }}
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.E2E_RUN_ID),
              filter: "latest",
            });
            const job = jobs.find((j) => j.name === "walkthrough");
            if (!job) {
              core.warning(`run ${process.env.E2E_RUN_ID} has no walkthrough job — cards show no video`);
              return;
            }
            core.info(`walkthrough job ${job.id}: ${job.status}/${job.conclusion}`);
            if (job.conclusion !== "success") {
              core.warning(`walkthrough job concluded ${job.conclusion} — failed journeys show no video`);
            }
            core.setOutput("job_url", job.html_url);

      - name: Download walkthrough recordings
        if: steps.walkthrough.outputs.job_url
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-walkthrough
          path: walkthrough-artifacts
          run-id: ${{ steps.e2e.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Generate dashboard
        env:
          # Absent file → no walkthrough (the generator warns and renders the no-video panel).
          WALKTHROUGH_EVIDENCE_FILE: ${{ steps.walkthrough.outputs.job_url && format('{0}/walkthrough-artifacts/walkthrough-evidence.json', github.workspace) || '' }}
          WALKTHROUGH_RUN_ID: ${{ steps.e2e.outputs.run_id }}
          WALKTHROUGH_RUN_URL: ${{ steps.walkthrough.outputs.job_url }}
          # The engine derives the artifact digest by hashing this file's bytes.
          EVIDENCE_FILE: ${{ github.workspace }}/e2e-artifacts/journey-evidence.json
          SOURCE_RUN_ID: ${{ steps.e2e.outputs.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_URL: ${{ steps.e2e.outputs.run_url }}
          SOURCE_COMMIT_SHA: ${{ steps.e2e.outputs.head_sha }}
          SOURCE_WORKFLOW: e2e
          SOURCE_JOB: e2e
          SOURCE_RUN_STARTED: ${{ steps.e2e.outputs.created_at }}
        run: pnpm --filter @teacher-assistant/verify-dashboard run generate

      # Hand the static output (index.html + videos/ + traces/ + stills/) to the publish job, which
      # builds it into the nginx image outside this container (no docker-in-docker).
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: dist-dashboard
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout supplies the Dockerfile + nginx.conf; the generated page comes
      # from the build job's artifact.
      - uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v7
        with:
          name: dashboard
          path: dist-dashboard

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validates the Dockerfile on every PR; pushes sha-<commit> + latest only from
      # main (the stack repo pins by sha/tag + digest, mirroring the app images).
      - name: Build (and push on main) the static dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/verify-dashboard/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
