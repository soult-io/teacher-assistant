name: verification-dashboard

# Regenerates the live TRACK Verification dashboard from main and publishes it as a
# small static nginx image to GHCR (ghcr.io/<owner>/teacher-assistant-verify). On a PR
# it builds the page and validates the image build (no push); on push to main it pushes
# sha-<commit> + latest. The deploy stack (nsoult-agentic/stack-lexington-teacher-assistant)
# pins the image by tag + digest and serves it PRIVATELY on Lexington behind the NPM
# (Neil's access gate) — replacing the previous public GitHub Pages target. PII-free/
# synthetic, same as the app images.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/teacher-assistant-verify

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the generator reads other workflows' run status via the Actions API
    # Official Playwright image matching the lockfile version: chromium + its
    # system libraries are baked in (same base as e2e.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: vitest cross-package imports and the PWA `vite preview`
      # both resolve to dist.
      - name: Build all workspaces
        run: pnpm -r run build

      - name: Verify Playwright chromium
        run: pnpm --filter @teacher-assistant/verify-dashboard exec playwright install chromium

      - name: Generate dashboard
        run: pnpm --filter @teacher-assistant/verify-dashboard run generate

      # Hand the static output (index.html + images/) to the publish job, which
      # builds it into the nginx image outside this container (no docker-in-docker).
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: dist-dashboard
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout supplies the Dockerfile + nginx.conf; the generated page comes
      # from the build job's artifact.
      - uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v7
        with:
          name: dashboard
          path: dist-dashboard

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validates the Dockerfile on every PR; pushes sha-<commit> + latest only from
      # main (the stack repo pins by sha/tag + digest, mirroring the app images).
      - name: Build (and push on main) the static dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/verify-dashboard/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
