name: release

# Release model (mirrors payroll-app / stack-payroll spec 13): the app repo only
# publishes artifacts. On a vX.Y.Z tag, re-verify then publish the four images at
# the release tag + minor + latest, and cut a GitHub release. Deployment is the
# stack repo's job (nsoult-agentic/stack-lexington-teacher-assistant): it pins by
# tag/sha and the owner merges the pin PR (the final gate) → Lexington Portainer
# GitOps redeploys.

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/teacher-assistant

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint + format (biome)
        run: pnpm lint
      - name: Build all workspaces
        run: pnpm -r run build
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests (domain-core)
        run: pnpm --filter @teacher-assistant/domain-core run test
      - name: FERPA-guard static checks
        run: pnpm --filter @teacher-assistant/ferpa-guard run test

  push-images:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pwa
            dockerfile: apps/pwa/Dockerfile
          - name: sync-relay
            dockerfile: services/sync-relay/Dockerfile
          - name: content-api
            dockerfile: services/content-api/Dockerfile
          - name: diff-orchestrator
            dockerfile: services/diff-orchestrator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute tags
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MINOR="${TAG%.*}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "minor_tag=${MINOR}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ steps.version.outputs.release_tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ steps.version.outputs.minor_tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
