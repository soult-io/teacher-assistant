name: release

# Release model (mirrors payroll-app / stack-payroll spec 13): the app repo only
# publishes artifacts. On a vX.Y.Z tag, re-verify then publish the four images at
# the release tag + minor + latest, and cut a GitHub release. Deployment is the
# stack repo's job (nsoult-agentic/stack-lexington-teacher-assistant): it pins by
# tag/sha and the owner merges the pin PR (the final gate) → Lexington Portainer
# GitOps redeploys.

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/teacher-assistant

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint + format (biome)
        run: pnpm lint
      - name: Build all workspaces
        run: pnpm -r run build
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests (domain-core)
        run: pnpm --filter @teacher-assistant/domain-core run test
      - name: FERPA-guard static checks
        run: pnpm --filter @teacher-assistant/ferpa-guard run test

  # Build + Trivy-scan the four images. Read-only; nothing here can push.
  scan-images:
    needs: [verify]
    runs-on: ubuntu-latest
    # Read-only on purpose: trivy-action is third-party and receives github.token (its
    # token-setup-trivy input defaults to it). This job's token cannot push packages.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pwa
            dockerfile: apps/pwa/Dockerfile
          - name: sync-relay
            dockerfile: services/sync-relay/Dockerfile
          - name: content-api
            dockerfile: services/content-api/Dockerfile
          - name: diff-orchestrator
            dockerfile: services/diff-orchestrator/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # pull: true re-resolves the base tag each run, so a patched base is used as soon
      # as it is published.
      - name: Build the image (local, for the scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          load: true
          push: false
          tags: teacher-assistant-${{ matrix.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: teacher-assistant-${{ matrix.name }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Hand the exact scanned image to the push job (a rebuild could re-resolve the
      # base tag to a digest that was never scanned).
      - name: Save the scanned image
        env:
          SCAN_IMAGE: teacher-assistant-${{ matrix.name }}:scan
        run: docker save "$SCAN_IMAGE" | gzip > image.tar.gz

      - name: Upload the scanned image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The only job with packages: write. Runs no third-party action; it pushes the image
  # scan-images scanned. needs: waits for every matrix leg, so one failed scan blocks
  # all four pushes (no half-published release).
  push-images:
    needs: [scan-images]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [pwa, sync-relay, content-api, diff-orchestrator]
    steps:
      - name: Download the scanned image
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.name }}

      - name: Load the scanned image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        env:
          SCAN_IMAGE: teacher-assistant-${{ matrix.name }}:scan
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        # vX.Y.Z → also vX.Y (minor) and latest.
        run: |
          MINOR_TAG="${RELEASE_TAG%.*}"
          for tag in "$RELEASE_TAG" "$MINOR_TAG" latest; do
            docker tag "$SCAN_IMAGE" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  github-release:
    needs: [push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
