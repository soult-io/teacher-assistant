packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "tools/*"
  - "e2e"

# pnpm 11 blocks dependency build scripts by default; approve only what needs one.
# esbuild ships a platform binary via a postinstall script (pulled in by vite/vitest).
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
