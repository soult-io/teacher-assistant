# pwa-static — SPA server for the Teacher Assistant app shell.
# Unprivileged nginx listens on 8080 (non-root). Public exposure + TLS are the
# Lexington NPM's job (deploy posture B); this server is reached by the proxy
# over the shared docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry document. The service worker serves navigations
    # NetworkFirst, so an online visitor re-fetches index.html on every load; a
    # cached copy would pin an old app shell. (The registration is inlined into
    # index.html, so it stays fresh with it.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Never cache the service worker itself — the browser must re-fetch sw.js to
    # detect a deploy. Belt-and-braces alongside the browser's own SW update check.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
